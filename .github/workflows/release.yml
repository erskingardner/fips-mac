name: Release universal macOS DMG

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run test
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Build signed and notarized universal DMG
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bun run tauri build --target universal-apple-darwin --bundles dmg
      - name: Verify universal slices, signing, Gatekeeper, and stapling
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          dmgs=(src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg)
          test "${#dmgs[@]}" -eq 1
          dmg="${dmgs[0]}"
          mount_dir="$(mktemp -d)"
          cleanup() {
            hdiutil detach "$mount_dir" -quiet 2>/dev/null || true
            rmdir "$mount_dir" 2>/dev/null || true
          }
          trap cleanup EXIT
          hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$mount_dir" -quiet
          app="$mount_dir/FIPS Monitor.app"
          binary="$app/Contents/MacOS/fips-monitor"
          test -d "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          spctl --assess --type execute --verbose=2 "$app"
          xcrun stapler validate "$app"
          xcrun stapler validate "$dmg"
          archs="$(lipo -archs "$binary")"
          grep -qw arm64 <<<"$archs"
          grep -qw x86_64 <<<"$archs"
          shasum -a 256 "$dmg" > "$dmg.sha256"
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.sha256
