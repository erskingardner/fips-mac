name: Release universal macOS DMG

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: erskingardner/fips
          ref: 3e7a0afbe45b3a475ab7b90edc1f5fab4494418a
          path: fips-source
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run test
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: cargo test --manifest-path src-tauri/service/Cargo.toml
      - name: Build signed and notarized universal DMG
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          FIPS_CHECKOUT_PATH: ${{ github.workspace }}/fips-source
        run: bun run tauri:build:developer-id --bundles dmg
      - name: Verify universal slices, signing, Gatekeeper, and stapling
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          dmgs=(src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg)
          test "${#dmgs[@]}" -eq 1
          dmg="${dmgs[0]}"
          mount_dir="$(mktemp -d)"
          cleanup() {
            hdiutil detach "$mount_dir" -quiet 2>/dev/null || true
            rmdir "$mount_dir" 2>/dev/null || true
          }
          trap cleanup EXIT
          hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$mount_dir" -quiet
          app="$mount_dir/FIPS.app"
          binary="$app/Contents/MacOS/fips-mac"
          fips_binary="$app/Contents/MacOS/fips"
          service_binary="$app/Contents/MacOS/fips-mac-service"
          test -d "$app"
          test -x "$fips_binary"
          test -x "$service_binary"
          test -f "$app/Contents/Library/LaunchDaemons/com.paper-robin.fips-mac.node.plist"
          test -f "$app/Contents/Library/LaunchDaemons/com.paper-robin.fips-mac.service-control.plist"
          codesign --verify --deep --strict --verbose=2 "$app"
          spctl --assess --type execute --verbose=2 "$app"
          xcrun stapler validate "$app"
          xcrun stapler validate "$dmg"
          archs="$(lipo -archs "$binary")"
          grep -qw arm64 <<<"$archs"
          grep -qw x86_64 <<<"$archs"
          for bundled_binary in "$fips_binary" "$service_binary"; do
            bundled_archs="$(lipo -archs "$bundled_binary")"
            grep -qw arm64 <<<"$bundled_archs"
            grep -qw x86_64 <<<"$bundled_archs"
            codesign --verify --strict --verbose=2 "$bundled_binary"
          done
          shasum -a 256 "$dmg" > "$dmg.sha256"
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.sha256
