name: Release universal macOS DMG

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: jmcorgan/fips
          ref: dc3bace9d183eba6a0d199aa2a7a7349ccd2124c
          path: fips-source
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Validate signing and notarization credentials
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_INSTALLER_CERTIFICATE: ${{ secrets.APPLE_INSTALLER_CERTIFICATE }}
          APPLE_INSTALLER_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_INSTALLER_CERTIFICATE_PASSWORD }}
          APPLE_INSTALLER_SIGNING_IDENTITY: ${{ secrets.APPLE_INSTALLER_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_INSTALLER_CERTIFICATE APPLE_INSTALLER_CERTIFICATE_PASSWORD APPLE_INSTALLER_SIGNING_IDENTITY APPLE_TEAM_ID; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done
          api_credentials=false
          apple_id_credentials=false
          if [[ -n "${APPLE_API_ISSUER:-}" && -n "${APPLE_API_KEY:-}" && -n "${APPLE_API_KEY_P8_BASE64:-}" ]]; then
            api_credentials=true
          fi
          if [[ -n "${APPLE_ID:-}" && -n "${APPLE_PASSWORD:-}" ]]; then
            apple_id_credentials=true
          fi
          if [[ "$api_credentials" != true && "$apple_id_credentials" != true ]]; then
            missing+=("APPLE_API_ISSUER + APPLE_API_KEY + APPLE_API_KEY_P8_BASE64, or APPLE_ID + APPLE_PASSWORD")
          fi
          if (( ${#missing[@]} )); then
            printf 'Missing release secrets:\n' >&2
            printf '  - %s\n' "${missing[@]}" >&2
            exit 1
          fi
      - name: Prepare App Store Connect notarization key
        shell: bash
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -n "${APPLE_API_KEY_P8_BASE64:-}" ]]; then
            key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8"
            printf '%s' "$APPLE_API_KEY_P8_BASE64" | openssl base64 -d -A -out "$key_path"
            chmod 0600 "$key_path"
            echo "APPLE_API_KEY_PATH=$key_path" >> "$GITHUB_ENV"
            echo "NOTARIZATION_MODE=api-key" >> "$GITHUB_ENV"
          else
            echo "NOTARIZATION_MODE=apple-id" >> "$GITHUB_ENV"
          fi
      - name: Verify notarization credentials with Apple
        shell: bash
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          if [[ -n "${APPLE_API_KEY_PATH:-}" ]]; then
            xcrun notarytool history \
              --key "$APPLE_API_KEY_PATH" \
              --key-id "$APPLE_API_KEY" \
              --issuer "$APPLE_API_ISSUER" \
              --output-format json >/dev/null
          else
            xcrun notarytool history \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" \
              --output-format json >/dev/null
          fi
      - run: bun install --frozen-lockfile
      - name: Import Developer ID Application and Installer certificates
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_INSTALLER_CERTIFICATE: ${{ secrets.APPLE_INSTALLER_CERTIFICATE }}
          APPLE_INSTALLER_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_INSTALLER_CERTIFICATE_PASSWORD }}
          APPLE_INSTALLER_SIGNING_IDENTITY: ${{ secrets.APPLE_INSTALLER_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/fips-installer.keychain-db"
          password="$(openssl rand -hex 24)"
          app_certificate="$RUNNER_TEMP/fips-application.p12"
          installer_certificate="$RUNNER_TEMP/fips-installer.p12"
          printf '%s' "$APPLE_CERTIFICATE" | openssl base64 -d -A -out "$app_certificate"
          printf '%s' "$APPLE_INSTALLER_CERTIFICATE" | openssl base64 -d -A -out "$installer_certificate"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$app_certificate" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security import "$installer_certificate" -k "$keychain" -P "$APPLE_INSTALLER_CERTIFICATE_PASSWORD" -T /usr/bin/productsign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain"
          keychains=("$keychain")
          while IFS= read -r existing; do
            if [[ -n "$existing" ]]; then
              keychains+=("$existing")
            fi
          done < <(security list-keychains -d user | sed 's/^[[:space:]]*"//;s/"$//')
          security list-keychains -d user -s "${keychains[@]}"
          security find-identity -v -p codesigning "$keychain" | grep -Fq "\"$APPLE_SIGNING_IDENTITY\""
          security find-identity -v -p basic "$keychain" | grep -Fq "\"$APPLE_INSTALLER_SIGNING_IDENTITY\""
      - name: Verify tag matches the application version
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(bun -e 'console.log(require("./package.json").version)')"
          tauri_version="$(bun -e 'console.log(require("./src-tauri/tauri.conf.json").version)')"
          test "$package_version" = "$tauri_version"
          base_tag="v${package_version}"
          case "$GITHUB_REF_NAME" in
            "$base_tag") ;;
            "$base_tag"-*)
              release_number="${GITHUB_REF_NAME#"$base_tag"-}"
              [[ "$release_number" =~ ^[1-9][0-9]*$ ]]
              (( release_number >= 2 ))
              ;;
            *)
              echo "Expected $base_tag or a same-day release tag such as $base_tag-2; got $GITHUB_REF_NAME" >&2
              exit 1
              ;;
          esac
      - run: bun run check
      - run: bun run test
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: cargo test --manifest-path src-tauri/service/Cargo.toml
      - name: Build signed and notarized universal DMG with API key
        if: ${{ env.NOTARIZATION_MODE == 'api-key' }}
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_INSTALLER_SIGNING_IDENTITY: ${{ secrets.APPLE_INSTALLER_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          FIPS_CHECKOUT_PATH: ${{ github.workspace }}/fips-source
        run: bun run tauri:build:developer-id --bundles dmg
      - name: Build signed and notarized universal DMG with Apple ID
        if: ${{ env.NOTARIZATION_MODE == 'apple-id' }}
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_INSTALLER_SIGNING_IDENTITY: ${{ secrets.APPLE_INSTALLER_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          FIPS_CHECKOUT_PATH: ${{ github.workspace }}/fips-source
        run: bun run tauri:build:developer-id --bundles dmg
      - name: Notarize and staple the DMG
        shell: bash
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          dmgs=(src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg)
          test "${#dmgs[@]}" -eq 1
          dmg="${dmgs[0]}"
          if [[ "$NOTARIZATION_MODE" == "api-key" ]]; then
            xcrun notarytool submit "$dmg" \
              --key "$APPLE_API_KEY_PATH" \
              --key-id "$APPLE_API_KEY" \
              --issuer "$APPLE_API_ISSUER" \
              --wait
          else
            xcrun notarytool submit "$dmg" \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" \
              --wait
          fi
          xcrun stapler staple "$dmg"
      - name: Verify universal slices, signing, Gatekeeper, and stapling
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          dmgs=(src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg)
          test "${#dmgs[@]}" -eq 1
          dmg="${dmgs[0]}"
          mount_dir="$(mktemp -d)"
          cleanup() {
            hdiutil detach "$mount_dir" -quiet 2>/dev/null || true
            rmdir "$mount_dir" 2>/dev/null || true
          }
          trap cleanup EXIT
          hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$mount_dir" -quiet
          app="$mount_dir/FIPS.app"
          binary="$app/Contents/MacOS/fips-mac"
          service_binary="$app/Contents/MacOS/fips-mac-service"
          arm_package="$app/Contents/Resources/fips-macos-arm64.pkg"
          intel_package="$app/Contents/Resources/fips-macos-x86_64.pkg"
          test -d "$app"
          test -x "$service_binary"
          test -f "$arm_package"
          test -f "$intel_package"
          test -f "$app/Contents/Library/LaunchDaemons/com.paper-robin.fips-mac.service-control.plist"
          pkgutil --check-signature "$arm_package"
          pkgutil --check-signature "$intel_package"
          arm_expanded="$(mktemp -d)/package"
          intel_expanded="$(mktemp -d)/package"
          pkgutil --expand-full "$arm_package" "$arm_expanded"
          pkgutil --expand-full "$intel_package" "$intel_expanded"
          test "$(lipo -archs "$arm_expanded/Payload/usr/local/bin/fips")" = "arm64"
          test "$(lipo -archs "$intel_expanded/Payload/usr/local/bin/fips")" = "x86_64"
          for package_root in "$arm_expanded" "$intel_expanded"; do
            for executable in fips fipsctl fipstop; do
              payload_binary="$package_root/Payload/usr/local/bin/$executable"
              codesign --verify --strict --verbose=2 "$payload_binary"
              signature_details="$(codesign --display --verbose=4 "$payload_binary" 2>&1)"
              grep -Eq '^Timestamp=' <<<"$signature_details"
              grep -Eq 'flags=.*\(runtime\)' <<<"$signature_details"
            done
          done
          codesign --verify --deep --strict --verbose=2 "$app"
          spctl --assess --type execute --verbose=2 "$app"
          xcrun stapler validate "$app"
          xcrun stapler validate "$dmg"
          archs="$(lipo -archs "$binary")"
          grep -qw arm64 <<<"$archs"
          grep -qw x86_64 <<<"$archs"
          bundled_archs="$(lipo -archs "$service_binary")"
          grep -qw arm64 <<<"$bundled_archs"
          grep -qw x86_64 <<<"$bundled_archs"
          codesign --verify --strict --verbose=2 "$service_binary"
          shasum -a 256 "$dmg" > "$dmg.sha256"
      - uses: softprops/action-gh-release@v2
        with:
          name: FIPS ${{ github.ref_name }}
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.sha256
