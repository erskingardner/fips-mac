name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Bun, Svelte, and Rust checks
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run test
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - run: cargo fmt --manifest-path src-tauri/service/Cargo.toml --all -- --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo clippy --manifest-path src-tauri/service/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: cargo test --manifest-path src-tauri/service/Cargo.toml
      - name: Unsigned native build
        run: bun run tauri build --no-bundle

  sibling-fips:
    name: FIPS control-contract smoke test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          path: fips-mac
      - uses: actions/checkout@v4
        with:
          repository: erskingardner/fips
          ref: 3e7a0afbe45b3a475ab7b90edc1f5fab4494418a
          path: fips
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fips
      - name: Test managed configuration contract
        working-directory: fips-mac
        env:
          FIPS_CHECKOUT_PATH: ${{ github.workspace }}/fips
        run: ./scripts/smoke-fips.sh
