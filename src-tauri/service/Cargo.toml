[package]
name = "fips-mac-service"
version = "2026.8.14"
description = "Privileged lifecycle controller for the FIPS Mac app"
authors = ["Paper Robin"]
license = "AGPL-3.0-only"
repository = "https://github.com/erskingardner/fips-mac"
edition = "2024"

[dependencies]
fips = { git = "https://github.com/jmcorgan/fips", rev = "dc3bace9d183eba6a0d199aa2a7a7349ccd2124c" }
hex = "0.4"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt", "signal", "sync", "time"] }

[dev-dependencies]
tempfile = "3"
